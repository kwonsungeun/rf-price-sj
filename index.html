<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF 거래소 시세 (선준님)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1016; --panel:#151a22; --panel2:#1c222c; --line:#262d39; --line2:#323a48;
    --text:#eef1f6; --dim:#8f99ad; --faint:#5d6679;
    --accent:#4da3ff; --accent-bg:rgba(77,163,255,.10);
    --g-hero:#c084fc; --g-rare:#60a5fa; --g-adv:#4ade80; --g-norm:#cbd5e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px}
  button{font:inherit}
  .shell{max-width:1480px;margin:0 auto;padding:0 18px 30px}

  /* 상단 바 */
  .top{position:sticky;top:0;z-index:20;background:rgba(13,16,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .topin{max-width:1480px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;white-space:nowrap}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.live{color:#4ade80;border-color:#24553a}
  .badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80}
  .spacer{flex:1}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06111f;font-weight:700}
  .btn:disabled{opacity:.5;cursor:wait}
  .msg{font-size:12px;color:var(--dim)}
  .msg.err{color:#ffb4a8}

  /* 필터 */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0 10px}
  .fhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;cursor:pointer;user-select:none}
  .fhead b{white-space:nowrap}
  .fhead b{font-size:14px}
  .fhead .arrow{transition:transform .15s;color:var(--dim)}
  .filters.closed .arrow{transform:rotate(-90deg)}
  .active{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
  .tag{background:var(--accent-bg);color:#b9dcff;border:1px solid rgba(77,163,255,.35);border-radius:6px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
  .tag.none{background:none;border-color:transparent;color:var(--faint)}
  .fbody{padding:4px 14px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 28px}
  .filters.closed .fbody{display:none}
  .col{min-width:0}
  .row{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
  .lbl{color:var(--dim);font-size:12.5px;width:62px;flex:none;padding-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
  .chip{border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:13px;line-height:1.25}
  .chip:hover{border-color:#4a5468}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#06111f;font-weight:700}
  .chip.g-영웅.on{background:var(--g-hero);border-color:var(--g-hero)}
  .chip.g-희귀.on{background:var(--g-rare);border-color:var(--g-rare)}
  .chip.g-고급.on{background:var(--g-adv);border-color:var(--g-adv)}
  .chip.g-일반.on{background:var(--g-norm);border-color:var(--g-norm)}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
  select,input[type=number],input[type=search]{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;height:31px}
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  input[type=number]{width:88px}
  input[type=search]{flex:1;min-width:140px}
  .sep{color:var(--faint)}
  .hint{font-size:12px;color:var(--faint);width:100%}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;cursor:pointer;margin-right:12px}
  .presets{display:flex;flex-wrap:wrap;gap:5px}
  .presets .btn{font-size:12px;padding:4px 9px;color:var(--dim)}

  /* 탭 + 요약 */
  .bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:2px 0 8px}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  .tab{padding:5px 13px;border-radius:6px;cursor:pointer;color:var(--dim);border:0;background:none;font-size:13px}
  .tab.on{background:var(--panel2);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--line2)}
  .count{font-size:13px}
  .count b{font-size:15px}
  .legend{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-left:auto}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

  /* 표 */
  .wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 150px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:7px 10px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:500;color:var(--dim);cursor:pointer;user-select:none;font-size:12.5px;border-bottom:1px solid var(--line2)}
  th:hover{color:var(--text)}
  th.sorted{color:var(--accent)}
  th.p,td.p{width:74px;min-width:66px}
  th.focus{background:#1d2b40;color:#cfe5ff}
  td.focus{box-shadow:inset 0 0 0 999px rgba(77,163,255,.06)}
  td.l,th.l{text-align:left}
  td.name,th.name{position:sticky;left:0;z-index:1;background:var(--panel);max-width:280px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  th.name{z-index:3;background:var(--panel2)}
  tbody tr:nth-child(even) td{background-color:#171c25}
  tbody tr:nth-child(even) td.name{background:#171c25}
  tbody tr:hover td,tbody tr:hover td.name{background:#212836}
  td.name{border-left:3px solid transparent}
  tr.g-영웅 td.name{border-left-color:var(--g-hero)}
  tr.g-희귀 td.name{border-left-color:var(--g-rare)}
  tr.g-고급 td.name{border-left-color:var(--g-adv)}
  tr.g-일반 td.name{border-left-color:var(--g-norm)}
  .gb{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:700;color:#0d1016}
  .sub{color:var(--dim);font-size:12.5px}
  td.v{color:#d5dae4}
  td.e::after{content:"·";color:#353d4b}
  td.h3{color:#fff;background:rgba(239,68,68,.42)!important;font-weight:700}
  td.h2{color:#ffe1c4;background:rgba(249,115,22,.22)!important;font-weight:600}
  td.h1{color:#fff1b8}
  td.bad{color:#6b7385;text-decoration:line-through}
  td.bad::after{content:"⚠";display:inline-block;margin-left:2px;color:#d4a72c;font-size:11px;text-decoration:none}
  td.match{outline:2px solid #4da3ff;outline-offset:-3px;border-radius:4px}
  td.top{font-weight:700;color:#fff}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  .note{font-size:12px;color:var(--faint);margin-top:6px}

  .tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
  .card ol{margin:0;padding-left:22px}
  .card li{padding:3px 0}
  .card li div{display:flex;justify-content:space-between;gap:8px}
  .card li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card li b{font-variant-numeric:tabular-nums}
  .gdot{display:inline-block;width:9px;height:9px;border-radius:50%}
  .notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--dim);font-size:13px}
  .notes ul{margin:6px 0 10px;padding-left:20px;line-height:1.7}
  .notes h4{margin:12px 0 2px;color:var(--text);font-size:13.5px}

  @media (max-width:980px){ .fbody{grid-template-columns:1fr} .legend{margin-left:0} }
  @media (max-width:640px){
    .shell,.topin{padding-left:10px;padding-right:10px}
    .lbl{width:52px}
    td.name,th.name{max-width:150px}
    input[type=number]{width:74px}
    .wrap{max-height:calc(100vh - 120px)}
    h1{font-size:16px}
    .c-sub,.c-grade{display:none}
    .sm{display:block!important}
    .active{order:5;flex-basis:100%}
    .legend{font-size:11px;gap:8px}
  }
  .sm{display:none;font-size:11px;color:var(--dim);font-weight:400}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <h1>RF 거래소 시세 · 선준님</h1>
  <span class="badge" id="src"></span>
  <span class="msg" id="msg"></span>
  <span class="spacer"></span>
  <button class="btn" id="refresh" title="구글 시트에서 최신 시세를 다시 불러옵니다">↻ 최신 시세 불러오기</button>
</div></div>

<div class="shell">
  <section class="filters" id="filters">
    <div class="fhead" id="fhead" role="button" aria-expanded="true">
      <span class="arrow">▼</span><b>필터</b>
      <div class="active" id="active"></div>
      <button class="btn" id="reset">초기화</button>
      <button class="btn" id="ftoggle">접기</button>
    </div>
    <div class="fbody">
      <div class="col">
        <div class="row"><span class="lbl">대분류</span><div class="chips" id="f-cat"></div></div>
        <div class="row"><span class="lbl">세부분류</span><div class="chips" id="f-sub"></div></div>
        <div class="row"><span class="lbl">빠른 예시</span><div class="presets">
          <button class="btn" data-preset="range">일반·고급 · 5~8강 80 이상</button>
          <button class="btn" data-preset="norm8">일반 · 8강 100 이상</button>
          <button class="btn" data-preset="adv10">고급 · 10강 150 이상</button>
          <button class="btn" data-preset="rare0">희귀 · 노강 300 이상</button>
          <button class="btn" data-preset="heroacc">영웅 장신구</button>
        </div></div>
      </div>
      <div class="col">
        <div class="row"><span class="lbl">등급</span><div class="chips" id="f-grade"></div></div>
        <div class="row"><span class="lbl">프라임</span><div class="chips" id="f-prime"></div></div>
        <div class="row"><span class="lbl">가격 조건</span><div class="ctl">
          <select id="f-from" aria-label="강화 범위 시작"></select><span class="sep">~</span>
          <select id="f-to" aria-label="강화 범위 끝"></select>
          <select id="f-mode" aria-label="조건 방식"><option value="any">중 하나라도</option><option value="all">모두</option></select>
          <input type="number" id="f-min" placeholder="최소" min="0" aria-label="최소 가격"><span class="sep">~</span>
          <input type="number" id="f-max" placeholder="최대" min="0" aria-label="최대 가격">
          <span class="hint" id="f-hint"></span>
        </div></div>
        <div class="row"><span class="lbl">검색</span><div class="ctl"><input type="search" id="f-q" placeholder="아이템 이름 (예: 보이드, 서클릿)"></div></div>
        <div class="row"><span class="lbl">옵션</span><div class="ctl">
          <label class="chk"><input type="checkbox" id="o-bad" checked> 이상치 의심 가격 제외</label>
          <label class="chk"><input type="checkbox" id="o-cols" checked> 빈 강화 열 숨기기</label>
        </div></div>
      </div>
    </div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="table" role="tab">시세표</button>
      <button class="tab" data-tab="top" role="tab">등급별 TOP 10</button>
      <button class="tab" data-tab="notes" role="tab">데이터 정리 내역</button>
    </div>
    <span class="count" id="count"></span>
    <span class="legend" id="legend">
      <span><i class="sw" style="background:rgba(239,68,68,.75)"></i>같은 등급·같은 강 상위 10%</span>
      <span><i class="sw" style="background:rgba(249,115,22,.5)"></i>상위 25%</span>
      <span><i class="sw" style="background:#fff1b8"></i>상위 50%</span>
      <span><i class="sw" style="outline:2px solid #4da3ff;outline-offset:-2px"></i>조건에 맞는 칸</span>
      <span><s>123</s><span style="color:#d4a72c">⚠</span> 이상치 의심</span>
    </span>
  </div>

  <section id="v-table">
    <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <p class="note">열 제목을 누르면 정렬됩니다(내림차순 → 오름차순 → 원래 순서).</p>
  </section>
  <section id="v-top" hidden>
    <div class="bar"><span class="sub">기준 강화</span><select id="t-lv" aria-label="TOP 기준 강화"></select><span class="sub">· 위 필터(대분류·세부분류·프라임·검색·가격 조건)가 같이 적용됩니다</span></div>
    <div class="tops" id="tops"></div>
  </section>
  <section id="v-notes" hidden><div class="notes" id="notes"></div></section>
</div>

  const rows=[]; let row=[], f="", q=false;

    if(!name || sub.startsWith("예시")) continue;
    const orig=name; for(const [a,b] of NAME_FIX) name=name.split(a).join(b);
    if(name!==orig) log.renamed.push(orig+" → "+name);
    const p=iLv.map((i,k)=>{
      const v=g(i).replace(/,/g,"");
      if(v==="?"){ log.question.push(name+" "+LV[k]); return null; }
      return /^\d+(\.\d+)?$/.test(v) ? Math.round(+v) : null;
    });
    if(p.every(v=>v==null)){ log.empty.push(sub+" · "+name); continue; }
    const key=sub+"|"+name;
    if(seen.has(key)){
      const prev=seen.get(key);
      if(prev.p.every((v,k)=>v===p[k])) log.dup.push(sub+" · "+name+" (같은 행 2번 → 1개만 남김)");
      else { prev.p=prev.p.map((v,k)=>v!=null?v:p[k]); log.dup.push(sub+" · "+name+" (중복 행 → 빈칸만 합침)"); }
      continue;
    }
    const it={sub, cat:g(iCat), grade:g(iGrade), name, p, prime:name.startsWith("프라임")};
    seen.set(key,it); items.push(it);
  }
  // 이상치 의심: 더 높은 강화 가격(정상값)의 4배를 넘는 낮은 강화 가격 → 낚시/오타 매물로 판단
  for(const it of items){
    const bad=new Set();
    it.p.forEach((v,i)=>{
      if(v==null||v<200) return;
      const higher=it.p.slice(0,i).filter((x,j)=>x!=null && !bad.has(j));
      if(higher.length && v>4*Math.max(...higher)) bad.add(i);
    });
    it.bad=bad;
    bad.forEach(i=>log.bad.push({it, i}));
  }
  // 같은 등급·같은 강 안에서의 순위(백분위) → 색칠
  for(const it of items) it.pct=[];
  for(const gname of new Set(items.map(x=>x.grade))){
    LV.forEach((_,k)=>{
      const vals=items.filter(x=>x.grade===gname && x.p[k]!=null && !x.bad.has(k)).map(x=>x.p[k]).sort((a,b)=>a-b);
      const n=vals.length;
      for(const it of items){
        if(it.grade!==gname || it.p[k]==null || it.bad.has(k)) continue;
        if(n<4){ it.pct[k]=0; continue; }
        let lo=0; while(lo<n && vals[lo]<it.p[k]) lo++;
        it.pct[k]=lo/(n-1);
      }
    });
  }
  for(const it of items){
    const ok=it.p.filter((v,k)=>v!=null && !it.bad.has(k));
    it.top=ok.length?Math.max(...ok):null;
    it.topAll=Math.max(...it.p.filter(v=>v!=null));
  }
  return {items, log};
}

// ---------- 상태 ----------
const DEF={cat:"전체", sub:"전체", grades:[], prime:"전체", from:"", to:"", mode:"any", min:"", max:"", q:"",
           noBad:true, hideCols:true, sort:null, dir:-1, tab:"table", tlv:"8강", open:true};
const KEY="rf-filter-sj-v1";
let S=Object.assign({}, DEF);
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign({},DEF,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let DATA=null;
const $=id=>document.getElementById(id);
const fmt=v=>v==null?"":v.toLocaleString("ko-KR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>s===""?null:+s;

// 가격 조건이 보는 강화 열(LV 인덱스) 목록
function rangeKs(){
  if(!S.from && !S.to) return LV.map((_,k)=>k);
  const a=LV_UP.indexOf(S.from||S.to), b=LV_UP.indexOf(S.to||S.from);
  const lo=Math.min(a,b), hi=Math.max(a,b);
  return LV_UP.slice(lo,hi+1).map(l=>LV.indexOf(l));
}
function rangeLabel(){
  if(!S.from && !S.to) return "전체 강화";
  const ks=rangeKs().map(k=>LV[k]);            // 낮은 강화 → 높은 강화 순서
  return ks.length===1 ? ks[0] : `${ks[0]}~${ks[ks.length-1]}`;
}
function hasPrice(){ return S.min!=="" || S.max!==""; }
function hasRange(){ return !!(S.from||S.to); }

function chips(el, opts, cur, onPick, multi, cls){
  el.innerHTML=opts.map(o=>{
    const on = multi ? cur.includes(o) : cur===o;
    return `<button class="chip ${cls?cls(o):""} ${on?"on":""}" data-v="${esc(o)}">${esc(o)}</button>`;
  }).join("");
  el.onclick=e=>{ const b=e.target.closest(".chip"); if(b) onPick(b.dataset.v); };
}

function val(it,k){ const v=it.p[k]; return (v==null || (S.noBad && it.bad.has(k))) ? null : v; }
function inPrice(v){ const min=num(S.min), max=num(S.max); return v!=null && (min==null||v>=min) && (max==null||v<=max); }

function filtered(){
  const q=S.q.trim().replace(/\s+/g,""), ks=rangeKs();
  return DATA.items.filter(it=>{
    if(S.cat!=="전체" && it.cat!==S.cat) return false;
    if(S.sub!=="전체" && it.sub!==S.sub) return false;
    if(S.grades.length && !S.grades.includes(it.grade)) return false;
    if(S.prime==="프라임만" && !it.prime) return false;
    if(S.prime==="프라임 제외" && it.prime) return false;
    if(q && !(it.name+it.sub).replace(/\s+/g,"").includes(q)) return false;
    if(hasPrice()){
      if(S.mode==="all"){
        // 범위 안에 가격이 있는 칸은 모두 조건을 만족해야 함 (빈 칸은 무시, 최소 1칸은 있어야 함)
        const vs=ks.map(k=>val(it,k)).filter(v=>v!=null);
        if(!vs.length || !vs.every(inPrice)) return false;
      } else if(!ks.some(k=>inPrice(val(it,k)))) return false;
    } else if(hasRange()){
      if(!ks.some(k=>val(it,k)!=null)) return false;   // 가격 없이 범위만 고르면: 그 범위에 시세가 있는 것
    }
    return true;
  });
}
function matchCell(it,k){
  const ks=rangeKs();
  if(!ks.includes(k)) return false;
  if(hasPrice()) return inPrice(val(it,k));
  return hasRange() && val(it,k)!=null;
}

function activeTags(){
  const t=[];
  if(S.cat!=="전체") t.push(S.cat);
  if(S.sub!=="전체") t.push(S.sub);
  if(S.grades.length) t.push(S.grades.join("·"));
  if(S.prime!=="전체") t.push(S.prime);
  if(hasPrice()||hasRange()){
    const p = hasPrice() ? ` ${S.min!==""?fmt(+S.min)+" 이상":""}${S.min!==""&&S.max!==""?" ":""}${S.max!==""?fmt(+S.max)+" 이하":""}` : " 시세 있음";
    t.push(rangeLabel()+(hasPrice()&&rangeKs().length>1?(S.mode==="all"?" 모두":" 중 하나라도"):"")+p);
  }
  if(S.q.trim()) t.push(`"${S.q.trim()}"`);
  if(!S.noBad) t.push("이상치 포함");
  return t;
}

function renderFilters(){
  const cats=["전체",...new Set(DATA.items.map(x=>x.cat))];
  chips($("f-cat"), cats, S.cat, v=>{ S.cat=v; S.sub="전체"; update(); });
  const subs=["전체",...new Set(DATA.items.filter(x=>S.cat==="전체"||x.cat===S.cat).map(x=>x.sub))];
  chips($("f-sub"), subs, S.sub, v=>{ S.sub=v; update(); });
  chips($("f-grade"), ["전체",...GRADES], S.grades.length?S.grades:["전체"], v=>{
    if(v==="전체") S.grades=[]; else S.grades=S.grades.includes(v)?S.grades.filter(x=>x!==v):[...S.grades,v];
    update();
  }, true, o=>"g-"+o);
  chips($("f-prime"), ["전체","프라임만","프라임 제외"], S.prime, v=>{ S.prime=v; update(); });
  $("f-from").value=S.from; $("f-to").value=S.to; $("f-mode").value=S.mode;
  $("f-mode").style.display = rangeKs().length>1 ? "" : "none";
  if(document.activeElement!==$("f-min")) $("f-min").value=S.min;
  if(document.activeElement!==$("f-max")) $("f-max").value=S.max;
  if(document.activeElement!==$("f-q")) $("f-q").value=S.q;
  $("o-bad").checked=S.noBad; $("o-cols").checked=S.hideCols;
  $("f-hint").textContent = hasPrice()
    ? (rangeKs().length>1
        ? (S.mode==="all" ? `${rangeLabel()}에 올라온 가격이 모두 조건에 맞는 아이템` : `${rangeLabel()} 중 한 칸이라도 조건에 맞는 아이템`)
        : `${rangeLabel()} 가격이 조건에 맞는 아이템`)
    : "강화 범위와 가격을 넣어보세요. 예: 5강 ~ 8강, 80 이상";
  const tags=activeTags();
  $("active").innerHTML = tags.length ? tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("") : `<span class="tag none">조건 없음 · 전체 보기</span>`;
  $("filters").classList.toggle("closed", !S.open);
  $("fhead").setAttribute("aria-expanded", S.open);
  $("ftoggle").textContent = S.open ? "접기" : "펼치기";
}

function cellCls(it,k){
  const v=it.p[k];
  if(v==null) return "e";
  if(it.bad.has(k)) return "bad";
  const p=it.pct[k];
  return p>=0.9?"h3":p>=0.75?"h2":p>=0.5?"h1":"v";
}

function renderTable(rows){
  const lvShown = LV.map((_,k)=>k).filter(k=>!S.hideCols || rows.some(it=>it.p[k]!=null));
  if(S.sort!=null){
    const d=S.dir;
    const key = S.sort==="name"?(it=>it.name):S.sort==="sub"?(it=>it.sub):S.sort==="grade"?(it=>GRADES.indexOf(it.grade)):S.sort==="top"?(it=>S.noBad?it.top:it.topAll):(it=>val(it,LV.indexOf(S.sort)));
    rows=rows.slice().sort((a,b)=>{
      const x=key(a), y=key(b);
      if(x==null && y==null) return 0; if(x==null) return 1; if(y==null) return -1;
      return (typeof x==="string" ? x.localeCompare(y,"ko") : x-y) * d;
    });
  }
  const focus = (hasRange()||hasPrice()) ? new Set(rangeKs()) : new Set();
  if(!hasRange() && hasPrice()) focus.clear();
  const th=(k,label,cls)=>`<th data-sort="${k}" class="${cls||""} ${S.sort===k?"sorted":""}">${label}${S.sort===k?(S.dir<0?" ▼":" ▲"):""}</th>`;
  $("tbl").tHead.innerHTML="<tr>"+th("name","아이템","l name")+th("sub","세부분류","l c-sub")+th("grade","등급","l c-grade")+
    lvShown.map(k=>th(LV[k],LV[k], "p"+(focus.has(k)?" focus":""))).join("")+th("top","최고가","p")+"</tr>";
  $("tbl").tHead.onclick=e=>{
    const t=e.target.closest("th"); if(!t) return;
    const k=t.dataset.sort;
    if(S.sort===k){ if(S.dir===-1) S.dir=1; else { S.sort=null; S.dir=-1; } }
    else { S.sort=k; S.dir = (k==="name"||k==="sub"||k==="grade")?1:-1; }
    update();
  };
  if(!rows.length){ $("tbl").tBodies[0].innerHTML=`<tr><td colspan="${lvShown.length+4}" class="empty">조건에 맞는 아이템이 없습니다.</td></tr>`; return; }
  $("tbl").tBodies[0].innerHTML=rows.map(it=>{
    const top=S.noBad?it.top:it.topAll;
    return `<tr class="g-${esc(it.grade)}"><td class="l name" title="${esc(it.name)}">${esc(it.name)}<span class="sm">${esc(it.sub)} · ${esc(it.grade)}</span></td><td class="l sub c-sub">${esc(it.sub)}</td>`+
      `<td class="l c-grade"><span class="gb" style="background:${GCOLOR[it.grade]||"#888"}">${esc(it.grade)}</span></td>`+
      lvShown.map(k=>{
        const c="p "+cellCls(it,k)+(focus.has(k)?" focus":"")+(matchCell(it,k)?" match":"");
        const tip=it.bad.has(k)?` title="이상치 의심: 더 높은 강화보다 4배 넘게 비쌈 (낚시·오타 매물 가능성)"`:"";
        return `<td class="${c}"${tip}>${fmt(it.p[k])}</td>`;
      }).join("")+`<td class="p top">${fmt(top)}</td></tr>`;
  }).join("");
}

function renderTop(base){
  const k=LV.indexOf(S.tlv);
  $("t-lv").value=S.tlv;
  const grades = S.grades.length?GRADES.filter(g=>S.grades.includes(g)):GRADES;
  $("tops").innerHTML=grades.map(g=>{
    const list=base.filter(it=>it.grade===g && val(it,k)!=null).sort((a,b)=>val(b,k)-val(a,k)).slice(0,10);
    return `<div class="card"><h3><i class="gdot" style="background:${GCOLOR[g]}"></i>${g} · ${S.tlv}</h3>`+
      (list.length?`<ol>${list.map(it=>`<li><div><span title="${esc(it.sub+" · "+it.name)}">${esc(it.name)} <span class="sub">${esc(it.sub)}</span></span><b>${fmt(val(it,k))}</b></div></li>`).join("")}</ol>`:`<div class="sub">데이터 없음</div>`)+`</div>`;
  }).join("");
}

function renderNotes(){
  const L=DATA.log, li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<ul><li>없음</li></ul>";
  $("notes").innerHTML=
    `<p>시트를 불러올 때 아래 항목을 자동으로 정리합니다. 원본 시트는 바뀌지 않으며, 시트에서 직접 고치면 이 목록에서도 빠집니다.</p>`+
    `<h4>⚠ 이상치 의심 가격 ${L.bad.length}건</h4><div>같은 아이템의 더 높은 강화 가격보다 4배 넘게 비싼 낮은 강화 가격입니다. 낚시 매물이나 입력 실수일 가능성이 높아서, 기본 설정에서는 필터·색칠·TOP·최고가 계산에서 뺍니다. 표에는 취소선으로 남아 있습니다.</div>`+
    li(L.bad.map(({it,i})=>`${it.sub} · ${it.name} — ${LV[i]} ${fmt(it.p[i])}  (비교: ${LV.map((l,k)=>it.p[k]!=null?l+" "+fmt(it.p[k]):null).filter(Boolean).join(", ")})`))+
    `<h4>이름 오타 자동 수정 ${L.renamed.length}건</h4>`+li(L.renamed)+
    `<h4>중복 행 ${L.dup.length}건</h4>`+li(L.dup)+
    `<h4>가격이 하나도 없는 행 ${L.empty.length}건 (목록에서 제외)</h4>`+li(L.empty)+
    `<h4>'?' 로 적힌 칸 ${L.question.length}건 (빈칸으로 처리)</h4>`+li(L.question);
}

function update(){
  save(); renderFilters();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===S.tab));
  $("v-table").hidden=S.tab!=="table"; $("v-top").hidden=S.tab!=="top"; $("v-notes").hidden=S.tab!=="notes";
  $("legend").style.display=S.tab==="table"?"":"none";
  const rows=filtered();
  $("count").innerHTML = S.tab==="notes" ? "" : `<b>${rows.length.toLocaleString()}</b>개 <span class="sub">/ 전체 ${DATA.items.length.toLocaleString()}개</span>`;
  if(S.tab==="table") renderTable(rows); else if(S.tab==="top") renderTop(rows); else renderNotes();
}

function bind(){
  const opts=`<option value="">전체</option>`+LV_UP.map(l=>`<option>${l}</option>`).join("");
  $("f-from").innerHTML=opts; $("f-to").innerHTML=opts;
  $("t-lv").innerHTML=LV_UP.map(l=>`<option>${l}</option>`).join("");
  $("f-from").onchange=e=>{ S.from=e.target.value; if(S.from && !S.to) S.to=S.from; if(!S.from) S.to=""; update(); };
  $("f-to").onchange=e=>{ S.to=e.target.value; if(S.to && !S.from) S.from=S.to; if(!S.to) S.from=""; update(); };
  $("f-mode").onchange=e=>{ S.mode=e.target.value; update(); };
  $("t-lv").onchange=e=>{ S.tlv=e.target.value; update(); };
  let tm; const deb=fn=>e=>{ clearTimeout(tm); tm=setTimeout(()=>fn(e),200); };
  $("f-min").oninput=deb(e=>{ S.min=e.target.value; update(); });
  $("f-max").oninput=deb(e=>{ S.max=e.target.value; update(); });
  $("f-q").oninput=deb(e=>{ S.q=e.target.value; update(); });
  $("o-bad").onchange=e=>{ S.noBad=e.target.checked; update(); };
  $("o-cols").onchange=e=>{ S.hideCols=e.target.checked; update(); };
  $("reset").onclick=e=>{ e.stopPropagation(); S=Object.assign({},DEF,{tab:S.tab, open:S.open}); update(); };
  $("ftoggle").onclick=e=>{ e.stopPropagation(); S.open=!S.open; update(); };
  $("fhead").onclick=e=>{ if(e.target.closest("button")) return; S.open=!S.open; update(); };
  document.querySelector(".tabs").onclick=e=>{ const t=e.target.closest(".tab"); if(t){ S.tab=t.dataset.tab; update(); } };
  const P={
    range:{grades:["일반","고급"],from:"5강",to:"8강",mode:"any",min:"80"},
    norm8:{grades:["일반"],from:"8강",to:"8강",min:"100",sort:"8강",dir:-1},
    adv10:{grades:["고급"],from:"10강",to:"10강",min:"150",sort:"10강",dir:-1},
    rare0:{grades:["희귀"],from:"노강",to:"노강",min:"300",sort:"노강",dir:-1},
    heroacc:{cat:"장신구",grades:["영웅"],sort:"top",dir:-1},
  };
  document.querySelector(".presets").onclick=e=>{
    const b=e.target.closest("[data-preset]"); if(!b) return;
    S=Object.assign({},DEF,{tab:"table",open:S.open},P[b.dataset.preset]); update();
  };
  $("refresh").onclick=()=>fetchLive(true);
}

function load(text, live, when){
  DATA=clean(parseCSV(text));
  $("src").textContent= live ? `구글 시트 최신 · ${when}` : `시트 스냅샷 ${SNAPSHOT_DATE}`;
  $("src").title = `아이템 ${DATA.items.length}개 · 가격 단위는 시트 그대로`;
  $("src").classList.toggle("live", !!live);
  update();
}

async function fetchLive(manual){
  const btn=$("refresh"), msg=$("msg");
  btn.disabled=true; msg.className="msg"; msg.textContent= manual ? "불러오는 중…" : "";
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(SHEET_CSV+"&_="+Date.now(),{signal:ctl.signal, cache:"no-store"});
    clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const text=await r.text();
    if(!text.includes("아이템이름")) throw new Error("시트 형식을 읽지 못함");
    if(clean(parseCSV(text)).items.length<50) throw new Error("아이템이 너무 적음");
    const now=new Date();
    load(text, true, `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`);
    msg.textContent = manual ? "최신 시세로 갱신했습니다" : "";
    if(manual) setTimeout(()=>{ if(msg.textContent.startsWith("최신")) msg.textContent=""; },3000);
  }catch(e){
    if(manual){ msg.className="msg err"; msg.textContent="이 주소에서는 시트를 직접 불러올 수 없습니다. 스냅샷 데이터를 보여주고 있어요."; }
  }finally{ btn.disabled=false; }
}

bind();
load(document.getElementById("snapshot").textContent.trim(), false);
fetchLive(false);   // 직접 호스팅된 주소(깃허브 페이지 등)에서는 열 때마다 최신 시트를 불러옴
})();
</script>
